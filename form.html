<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Fill Me In">

<title>HTML5 Start Site by Paul Cheney</title>

<!-- TELLS PHONES NOT TO LIE ABOUT THEIR WIDTH & stops the font from enlarging when a phone is turned sideways-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<!-- STYLE SHEETS -->
<link href="styles/form.css" rel="stylesheet">
     
</head>
<body>
<!-- HEADER HERE -->
	<header>
        <h1>PRODUCT REVIEW</h1>
    </header>
    
    
<!-- CONTENT HERE -->
<main>
    <form method="get" action ="thanks.html" class="wf1">
            <label>Product Name
                <select name="subject">
                    <option value="">Choose a product &#9662;</option>
                <option value="software">Software Development</option>
                <option value="creative">Creative Professional</option>
                <option value="info">Information Technology</option>
                <option value="data">Data Professional</option>
                <option value="construction"> Construction</option>
                <option value="manufacturing">Manufacturing</option>
                <option value="business">Business Professional</option>
                <option value="security">Cyber Security</option>    
                </select>
                <!-- caso nao selecione nada value fica null com please select  -->
            </label>

            <p class="rating-title">Overall Rating</p>
            <div class="rating-group">
                <div class="rating-item">
                    <label for="opcao1">☆</label>
                    <input type="radio" id="opcao1" name="grupo_opcao" value="opcao1">   
                </div>
            
                <div class="rating-item">
                    <label for="opcao2">☆☆</label>
                    <input type="radio" id="opcao2" name="grupo_opcao" value="opcao2">         
                </div>

                <div class="rating-item">
                    <label for="opcao3">☆☆☆</label>
                    <input type="radio" id="opcao3" name="grupo_opcao" value="opcao3">             
                </div>

                <div class="rating-item">
                     <label for="opcao4">☆☆☆☆</label>
                    <input type="radio" id="opcao4" name="grupo_opcao" value="opcao4">                
                </div>
                
                <div class="rating-item">
                    <label for="opcao5">☆☆☆☆☆</label>
                    <input type="radio" id="opcao5" name="grupo_opcao" value="opcao5">                
                </div>
            </div>
            

            <label>Date of Installation<input type="date" name="completedDate"></label>

            <div>Wich features did you find useful in the product? (Check all that apply)</div>
            <label><input type="checkbox" name="durability" value="yes">Durability</label>
            <label><input type="checkbox" name="ease-of-use" value="yes">Ease of Use</label>
            <label><input type="checkbox" name="performance" value="yes">Performance</label>       
            <label><input type="checkbox" name="design" value="yes">Design</label>

            <label>Written Review (Optional)<input type="review" name="review"></label>

            <label>Your Name (Optional)<input type="text" name="fname"></label>
        <input type="submit" value ="Post Review">
    </form>          
</main>
