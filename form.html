<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="Share your experience and review our products. Submit your feedback quickly and help us deliver the best quality solutions for you.">
    <meta name="author" content="John Doe">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Start Site by Icaro Lima</title>
    <!-- STYLE SHEETS AND SCRIPTS -->
    <link href="styles/form.css" rel="stylesheet">
    <script src="scripts/form.js" defer></script>      
</head>
<body>
<!-- HEADER HERE -->
	<header>
        <h1>PRODUCT REVIEW</h1>
    </header>
<!-- CONTENT HERE -->
<main>
    <form method="get" action="review.html" class="wf1">
            <label for="subject">Product Name</label>
            <select name="subject" id="subject" required>
                <option value="" disabled selected>Select a product &#9662;</option>
                <option value="software" id="p-0" label="Software Development"></option>
                <option value="creative" id="p-1" label="Creative Professional"></option>
                <option value="info" id="p-2" label="Information Technology"></option>
                <option value="data" id="p-3" label="Data Professional"></option>
                <option value="construction" id="p-4" label="Construction"></option>
                <option value="manufacturing" id="p-5" label="Manufacturing"></option>
                <option value="business" id="p-6" label="Business Professional"></option>
                <option value="security" id="p-7" label="Cyber Security"></option>
            </select>
            <!-- caso nao selecione nada value fica null com please select  -->
            

            <p class="rating-title">Overall Rating</p>
            <div class="rating-group">
                <div class="rating-item">
                    <label for="opcao1">☆</label>
                    <input type="radio" id="opcao1" name="grupo_opcao" value="opcao1" required>   
                </div>
            
                <div class="rating-item">
                    <label for="opcao2">☆☆</label>
                    <input type="radio" id="opcao2" name="grupo_opcao" value="opcao2" required>         
                </div>

                <div class="rating-item">
                    <label for="opcao3">☆☆☆</label>
                    <input type="radio" id="opcao3" name="grupo_opcao" value="opcao3" required>             
                </div>

                <div class="rating-item">
                     <label for="opcao4">☆☆☆☆</label>
                    <input type="radio" id="opcao4" name="grupo_opcao" value="opcao4" required>                
                </div>
                
                <div class="rating-item">
                    <label for="opcao5">☆☆☆☆☆</label>
                    <input type="radio" id="opcao5" name="grupo_opcao" value="opcao5" required>                
                </div>
            </div>
            
        <label for="completedDate">Date of Installation</label>
        <input type="date" id="completedDate" name="completedDate">

        <div>Which features did you find useful in the product? (Check all that apply)</div>
        
        <input type="checkbox" id="durability" name="durability" value="yes">
        <label for="durability">Durability</label>

        <input type="checkbox" id="ease-of-use" name="ease-of-use" value="yes">
        <label for="ease-of-use">Ease of Use</label>

        <input type="checkbox" id="performance" name="performance" value="yes">
        <label for="performance">Performance</label>      

        <input type="checkbox" id="design" name="design" value="yes">
        <label for="design">Design</label>

        <label for="review">Written Review (Optional)</label>
        <textarea name="review" id="review"></textarea>

        <label for="fname">Your Name (Optional)</label>
        <input type="text" id="fname" name="fname">
        <input type="submit" value="Post Review">
    </form>          
</main>
    
<!-- FOOTER HERE -->   
    <footer>
        <p class="last-text">©<span id="currentyear"></span> 💻 Icaro Emanuel Pereira Lima Brazil 💻</p>
        <p id="lastmodified"></p> 
    </footer>
</body>
</html>
